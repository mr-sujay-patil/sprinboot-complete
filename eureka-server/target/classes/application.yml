server:
  port: 8761 # WHY: Standard default port for Eureka service discovery server.

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false # WHY: Configures Eureka Server to not register itself as a client instance.
    fetch-registry: false # WHY: Configures Eureka Server to not fetch registry from remote peers (standalone mode).
    service-url:
      defaultZone: http://localhost:8761/eureka/
